<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepForensic</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div>
          <h1>DeepForensic</h1>
          <p class="subtitle" id="subtitle-text">Detector de Deepfake Audio</p>
        </div>
        <div class="lang-toggle" role="radiogroup" aria-label="Idioma / Language">
          <button id="lang-es" class="lang-btn active" data-lang="es" role="radio" aria-checked="true" aria-label="Español">ES</button>
          <button id="lang-en" class="lang-btn" data-lang="en" role="radio" aria-checked="false" aria-label="English">EN</button>
        </div>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Navigation tabs">
      <button class="tab active" data-tab="file" role="tab" aria-selected="true" id="tab-btn-file">Archivo</button>
      <button class="tab" data-tab="url" role="tab" aria-selected="false" id="tab-btn-url">URL</button>
      <button class="tab" data-tab="history" role="tab" aria-selected="false" id="tab-btn-history">Historial</button>
    </div>

    <section id="tab-file" class="tab-content active" role="tabpanel" aria-labelledby="tab-btn-file">
      <label class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="Suelta un archivo aquí o haz clic para seleccionar">
        <span class="drop-text">Suelta un archivo aquí o haz clic para seleccionar</span>
        <span class="drop-hint">.wav .mp4 .mp3 .m4a</span>
        <input type="file" id="file-input" accept=".wav,.mp4,.mp3,.m4a,audio/*,video/*" aria-hidden="true" />
      </label>
    </section>

    <section id="tab-url" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-url">
      <div class="input-group">
        <label for="url-input" id="url-label">URL de video/audio:</label>
        <div class="url-row">
          <input type="url" id="url-input" placeholder="https://twitter.com/..." aria-label="URL de video o audio" />
          <button id="capture-tab-btn" class="btn-icon" title="Capturar URL de la pestaña activa" aria-label="Capturar URL de la pestaña activa">🔗</button>
        </div>
        <button id="analyze-url-btn" class="btn-primary" aria-label="Analizar URL">Analizar URL</button>
      </div>
    </section>

    <div id="loading" class="hidden" role="status" aria-live="polite">
      <div class="spinner"></div>
      <p>Analizando...</p>
    </div>

    <div id="result" class="hidden" role="alert" aria-live="assertive">
      <div id="veredicto-badge" class="badge"></div>
      <div class="metrics">
        <div class="metric">
          <span class="metric-label" id="metric-confidence">Confianza</span>
          <span id="confianza" class="metric-value"></span>
        </div>
        <div class="metric">
          <span class="metric-label" id="metric-instability">Inestabilidad de fase</span>
          <span id="inestabilidad" class="metric-value"></span>
        </div>
      </div>
      <button id="listen-result-btn" class="btn-secondary listen-btn" aria-label="Escuchar resultado">🔊 Escuchar</button>
      <button id="download-pdf-btn" class="btn-secondary" aria-label="Descargar PDF">Descargar PDF</button>
      <button id="new-analysis-btn" class="btn-link">Nuevo análisis</button>
    </div>

    <div id="error" class="hidden" role="alert" aria-live="assertive">
      <p class="error-text"></p>
      <button id="retry-btn" class="btn-link">Reintentar</button>
    </div>

    <section id="tab-history" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-history">
      <div id="history-list" role="list" aria-label="Historial de análisis"></div>
      <button id="clear-history-btn" class="btn-link" style="color:#ef4444;" aria-label="Limpiar historial">Limpiar historial</button>
    </section>
  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
