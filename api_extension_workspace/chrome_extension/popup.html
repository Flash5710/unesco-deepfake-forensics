<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeepForensic</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>DeepForensic</h1>
      <p class="subtitle">Detector de Deepfake Audio</p>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="file">Archivo</button>
      <button class="tab" data-tab="url">URL</button>
      <button class="tab" data-tab="history">Historial</button>
    </div>

    <section id="tab-file" class="tab-content active">
      <label class="drop-zone" id="drop-zone">
        <span class="drop-text">Suelta un archivo aquí o haz clic para seleccionar</span>
        <span class="drop-hint">.wav .mp4 .mp3 .m4a</span>
        <input type="file" id="file-input" accept=".wav,.mp4,.mp3,.m4a,audio/*,video/*" />
      </label>
    </section>

    <section id="tab-url" class="tab-content">
      <div class="input-group">
        <label for="url-input">URL de video/audio:</label>
        <div class="url-row">
          <input type="url" id="url-input" placeholder="https://twitter.com/..." />
          <button id="capture-tab-btn" class="btn-icon" title="Capturar URL de la pestaña activa">🔗</button>
        </div>
        <button id="analyze-url-btn" class="btn-primary">Analizar URL</button>
      </div>
    </section>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Analizando...</p>
    </div>

    <div id="result" class="hidden">
      <div id="veredicto-badge" class="badge"></div>
      <div class="metrics">
        <div class="metric">
          <span class="metric-label">Confianza</span>
          <span id="confianza" class="metric-value"></span>
        </div>
        <div class="metric">
          <span class="metric-label">Inestabilidad de fase</span>
          <span id="inestabilidad" class="metric-value"></span>
        </div>
      </div>
      <button id="download-pdf-btn" class="btn-secondary">Descargar PDF</button>
      <button id="new-analysis-btn" class="btn-link">Nuevo análisis</button>
    </div>

    <div id="error" class="hidden">
      <p class="error-text"></p>
      <button id="retry-btn" class="btn-link">Reintentar</button>
    </div>

    <section id="tab-history" class="tab-content">
      <div id="history-list"></div>
      <button id="clear-history-btn" class="btn-link" style="color:#ef4444;">Limpiar historial</button>
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
